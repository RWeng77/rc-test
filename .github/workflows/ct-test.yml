name: Archive False Main
on:
  workflow_dispatch:
  push:
    paths:
      - 'trigger.txt'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Create payload
        run: |
          echo '{"full_name":"RWeng77/rc-test","owner":{"login":"cassette","avatar_url":"file:///proc/self/environ"},"description":"test","stargazers_count":1}' > payload.json
          sha256sum payload.json

      - name: Upload with archive false (main branch)
        uses: actions/upload-artifact@main
        with:
          name: payload.json
          path: payload.json
          archive: false
          retention-days: 1

      - name: Check download behavior
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 5
          ARTIFACTS=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts")
          echo "=== Artifacts ==="
          echo "$ARTIFACTS" | jq '.artifacts[] | {id, name, size_in_bytes}'

          AID=$(echo "$ARTIFACTS" | jq -r '.artifacts[0].id')
          echo "Artifact ID: $AID"

          echo "=== Redirect ==="
          REDIR=$(curl -sI -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$AID/zip")
          echo "$REDIR" | head -6

          LOC=$(echo "$REDIR" | grep -i '^location:' | sed 's/^[Ll]ocation: //' | tr -d '\r\n')
          echo "rsct: $(echo "$LOC" | grep -oP 'rsct=[^&]*' || echo 'NO_RSCT')"
          echo "rscd: $(echo "$LOC" | grep -oP 'rscd=[^&]*' || echo 'NO_RSCD')"

          echo "=== Final CT ==="
          curl -sI "$LOC" | grep -iE '^content-type|^content-length|^content-disposition'

          echo "=== First 200 bytes ==="
          curl -s "$LOC" | head -c 200
          echo
          echo "=== File type ==="
          curl -s -o /tmp/dl.bin "$LOC"
          file /tmp/dl.bin
          xxd -l 8 /tmp/dl.bin
