name: Race v2
on:
  workflow_dispatch:
  push:
    paths:
      - 'trigger.txt'

jobs:
  race:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --ignore-scripts
      - uses: ./artifact-action
