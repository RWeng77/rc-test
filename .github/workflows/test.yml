name: Artifact CT Test v2
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Create payload
        run: |
          python3 -c "
          import json
          payload = json.dumps({
            'full_name': 'RWeng77/rc-test',
            'owner': {'login': 'cassette', 'avatar_url': 'file:///proc/self/environ'},
            'description': 'Repo Cassette postcard',
            'stargazers_count': 42
          }, separators=(',', ':'))
          with open('payload.json', 'w') as f:
            f.write(payload)
          print('Payload:', payload[:200])
          print('SHA256:', __import__('hashlib').sha256(payload.encode()).hexdigest())
          "
      
      - name: Show all ACTIONS env vars
        run: env | grep -i "ACTIONS_\|GITHUB_" | sort | sed 's/=.*/=***/'

      - name: Upload non-zipped artifact (v4 with compression none)
        uses: actions/upload-artifact@v4
        with:
          name: test-nozip
          path: payload.json
          compression-level: 0
          retention-days: 1

      - name: Install @actions/artifact and upload directly
        run: |
          npm init -y > /dev/null
          npm install @actions/artifact@latest 2>&1 | tail -3
          
          node -e "
          const artifact = require('@actions/artifact');
          const client = new artifact.DefaultArtifactClient();
          
          (async () => {
            try {
              // Upload with the standard client
              const result = await client.uploadArtifact(
                'test-direct',
                ['payload.json'],
                '.',
                { retentionDays: 1, compressionLevel: 0 }
              );
              console.log('Upload result:', JSON.stringify(result));
            } catch(e) {
              console.error('Error:', e.message);
            }
          })();
          " 2>&1

      - name: Check all artifact downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 5
          echo "=== All artifacts ==="
          ARTIFACTS=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts")
          echo "$ARTIFACTS" | jq '.artifacts[] | {id, name, size_in_bytes}'
          
          for NAME in test-nozip test-direct; do
            AID=$(echo "$ARTIFACTS" | jq -r ".artifacts[] | select(.name==\"$NAME\") | .id")
            if [ -n "$AID" ] && [ "$AID" != "null" ]; then
              echo ""
              echo "=== $NAME (ID=$AID) ==="
              REDIR=$(curl -s -o /dev/null -D- \
                -H "Authorization: token $GH_TOKEN" \
                "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$AID/zip")
              LOC=$(echo "$REDIR" | grep -i "^location:" | tr -d '')
              echo "rsct: $(echo "$LOC" | grep -oP 'rsct=[^&]*' || echo 'NONE')"
              
              # Follow redirect and check final CT
              FINAL_URL=$(echo "$LOC" | sed 's/location: //i')
              echo "Final CT: $(curl -sI "$FINAL_URL" | grep -i '^content-type')"
              
              # Also download and check what's inside
              curl -s -o "/tmp/$NAME.bin" "$FINAL_URL"
              echo "Downloaded size: $(wc -c < /tmp/$NAME.bin)"
              echo "First 4 bytes hex: $(xxd -l4 -p /tmp/$NAME.bin)"
              file "/tmp/$NAME.bin"
            fi
          done

      - name: Try direct blob upload with custom CT
        run: |
          # Try to find the Azure upload URL by looking at artifact internals
          node -e "
          const http = require('http');
          const https = require('https');
          const artifact = require('@actions/artifact');
          
          // Monkey-patch https.request to intercept Azure uploads
          const origRequest = https.request;
          https.request = function(...args) {
            const url = typeof args[0] === 'string' ? args[0] : args[0].href || args[0].hostname;
            if (String(url).includes('blob.core.windows.net')) {
              console.log('INTERCEPTED Azure URL:', String(url).substring(0, 200));
              const opts = typeof args[0] === 'object' ? args[0] : {};
              console.log('Method:', opts.method);
              console.log('Headers:', JSON.stringify(opts.headers || {}));
            }
            return origRequest.apply(this, args);
          };
          
          const client = new artifact.DefaultArtifactClient();
          (async () => {
            try {
              await client.uploadArtifact('test-intercept', ['payload.json'], '.', {retentionDays: 1});
            } catch(e) {
              console.log('Expected error or completed:', e.message?.substring(0, 200));
            }
          })();
          " 2>&1 | head -30
